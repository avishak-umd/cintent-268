name: tutorials-dynapyt

# CINTENT >> MANUAL_TRIGGER
# on:
#   push:
#     branches:
#       - main
#     paths:
#       - docs/tutorials/**
#   pull_request:
#     branches:
#       - main
#     paths:
#       - docs/tutorials/**
on: [repository_dispatch, workflow_dispatch]

defaults:
  run:
    shell: bash
jobs:
  notebooks:
    name: notebooks
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5.0.0

      - name: Set up python
        id: setup-python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      
      # DynaPyt inserted where CIntent is inserted: instrument all Python
      # present at job start (the installer and the project).
      - uses: clonedSemicolon/seytup-dynapyt@master
        with:
          targets: |
            package:pip
            directory:torchgeo
          dynapyt_path: git+https://github.com/sola-st/DynaPyt.git@07680e074c9f280c320f9e359500f672b662de7f

      # CINTENT >> REMOVE_CACHE
      # - name: Cache dependencies
      #   uses: actions/cache@v4.2.4
      #   id: cache
      #   with:
      #     path: ${{ env.pythonLocation }}
      #     key: ${{ runner.os }}-${{ runner.arch }}-Python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements/required.txt', 'requirements/docs.txt', 'requirements/tests.txt') }}-tutorials
      
      - name: Install pip dependencies
        # if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r requirements/required.txt -r requirements/docs.txt -r requirements/tests.txt planetary_computer pystac tensorboard h5py scikit-learn .
          pip cache purge
          
      - name: List pip dependencies
        run: pip list

      - name: Run notebook checks
        run: pytest --nbmake --durations=10 docs/tutorials

      - name: Collect DynaPyt traces
        uses: clonedSemicolon/seytup-dynapyt@master
        if: always()
        with:
          mode: collect
          artifact-name: dynapyt-results
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
